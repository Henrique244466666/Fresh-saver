<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshSaver - Food Expiry & Donation Tracker</title>
    <meta name="description" content="Smart food tracking app to scan groceries, get expiration alerts, match waste-reducing recipes, and find local food donation drop-offs." />
    <meta property="og:title" content="FreshSaver - Food Expiry & Donation Tracker" />
    <meta property="og:description" content="Smart food tracking app to scan groceries, get expiration alerts, match waste-reducing recipes, and find local food donation drop-offs." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FreshSaver" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent unhandled WebSocket closure errors in AI Studio reverse proxy
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
