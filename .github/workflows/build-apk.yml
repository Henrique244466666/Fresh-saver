name: Build Android APK (TWA Bubblewrap)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-pwa-and-apk:
    name: Build PWA & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build Android APK via Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          # Builds the signed APK using twa-manifest.json
          echo "Building Android TWA package..."
          if [ -f twa-manifest.json ]; then
            npx @bubblewrap/cli build --skipPwaValidation || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshsaver-android-apk
          path: |
            *.apk
            dist/
